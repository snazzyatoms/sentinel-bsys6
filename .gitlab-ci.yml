stages:
  - images
  - build

Images:
  stage: images
  when: manual
  image: registry.gitlab.com/librewolf-community/browser/bsys5/dind
  tags: [autoscale]
  parallel:
    matrix:
      - TARGET:
          - linux
          - windows
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.gitlab.com
    - ./bsys6 build_image
    - docker push registry.gitlab.com/maltejur/bsys6/$TARGET:latest

Linux:
  stage: build
  when: manual
  allow_failure: false
  image: registry.gitlab.com/maltejur/bsys6/linux:latest
  tags:
    - autoscale
  except:
    - merge_requests
  script:
    - ./bsys6 package
  artifacts:
    paths:
      - "*.tar.bz2"

Windows:
  stage: build
  when: manual
  allow_failure: false
  image: registry.gitlab.com/maltejur/bsys6/windows:latest
  tags:
    - autoscale
  except:
    - merge_requests
  script:
    - ./bsys6 package nsis msix
  artifacts:
    paths:
      - "*.zip"
      - "*setup.exe"
      - "*.msix"
      - "*.sha256sum"
