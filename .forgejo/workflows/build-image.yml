name: Docker Image

on:
  workflow_dispatch:

jobs:
  kickstart:
    runs-on: epsilon
    outputs:
      completion_url: ${{ steps.kickstart.outputs.completion_url }}
    steps:
      - uses: actions/checkout@v4
      - id: kickstart
        uses: https://codeberg.org/alyx161/kickstart@main
        with:
          mode: spawn
          auth_token: ${{ secrets.KICKSTART_TOKEN }}
          count: '5'
          ttl-minutes: '45'
          provider: auto
          plan: compute-large
          name-prefix: bsys6
          labels: '["bsys6-kickstart"]'
  build-images:
    runs-on: bsys6-kickstart
    container:
      image: codeberg.org/librewolf/bsys6:dind
    strategy:
      matrix:
        target: [windows, macos, linux, dind, release]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: codeberg.org
          username: ${{ vars.FORGE_USER }}
          password: ${{ secrets.FORGE_TOKEN }}

      - name: Build Docker Image
        env:
           TARGET: ${{ matrix.target }}
        run:
          ./bsys6 build_image

      - name: Push Docker Image
        run: |
          docker push codeberg.org/${{ forgejo.repository_owner }}/bsys6:${{ matrix.target }}

  cleanup:
    if: always()
    needs:
      - kickstart
      - build-images
    runs-on: epsilon
    steps:
      - uses: actions/checkout@v4
      - id: cleanup
        uses: https://codeberg.org/alyx161/kickstart@main
        with:
          mode: cleanup
          completion-url: ${{ needs.kickstart.outputs.completion_url }}