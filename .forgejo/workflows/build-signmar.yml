name: Build signmar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: epsilon
    container:
      image: librewolf.dev/librewolf/bsys6:linux
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build
        env:
          SIGNMAR: true
        run: |
          cat > /etc/apt/sources.list.d/forky.sources <<'EOF'
          Types: deb deb-src
          URIs: http://deb.debian.org/debian
          Suites: forky
          Components: main
          Signed-By: /usr/share/keyrings/debian-archive-keyring.gpg
          EOF

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get -y -t forky --no-install-recommends install libnss3-dev libnspr4-dev
          DEBIAN_FRONTEND=noninteractive apt-get -y -t forky --no-install-recommends build-dep firefox-esr
          ./bsys6 package

      - name: Upload artifacts
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: signmar
          path: signmar
          retention-days: 3

  publish-release:
    runs-on: epsilon
    container:
      image: librewolf.dev/librewolf/bsys6:dind
    needs: [build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: signmar

      - name: Upload to Package Registry
        env:
          FORGE_USER: ${{ vars.FORGE_USER }}
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -euo pipefail

          package_url="${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}/generic/signmar/latest/signmar"

          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --user "$FORGE_USER:$FORGE_TOKEN" \
            --request DELETE \
            "$package_url")"

          if [[ "$status" != "204" && "$status" != "404" ]]; then
            echo "Failed to delete existing latest file. HTTP status: $status" >&2
            exit 1
          fi

          curl --fail --silent --show-error --http1.1 \
            --user "$FORGE_USER:$FORGE_TOKEN" \
            --upload-file signmar \
            "$package_url"
