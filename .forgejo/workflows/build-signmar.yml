name: Build signmar

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: epsilon
    container:
      image: librewolf.dev/librewolf/bsys6:linux
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Build
        env:
          SIGNMAR: true
        run: ./bsys6 package

      - name: Upload artifacts
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: signmar
          path: signmar
          retention-days: 3

  publish-release:
    runs-on: epsilon
    container:
      image: librewolf.dev/librewolf/bsys6:dind
    needs: [build]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: signmar

      - name: Upload to Package Registry
        run: |
          set -euo pipefail

          package_url="${{ forgejo.server_url }}/api/packages/${{ forgejo.repository_owner }}/generic/signmar/latest/signmar"
          credentials="${{ vars.FORGE_USER }}:${{ secrets.FORGE_TOKEN }}"

          status="$(curl --silent --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --user "$credentials" \
            --request DELETE \
            "$package_url")"

          if [[ "$status" != "204" && "$status" != "404" ]]; then
            echo "Failed to delete existing latest file. HTTP status: $status" >&2
            exit 1
          fi

          curl --fail --silent --show-error --http1.1 \
            --user "$credentials" \
            --upload-file signmar \
            "$package_url"
