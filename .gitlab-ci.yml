stages:
  - images
  - build
  - release

Images:
  stage: images
  when: manual
  image: registry.gitlab.com/librewolf-community/browser/bsys6/dind
  tags: [autoscale]
  parallel:
    matrix:
      - TARGET:
          - dind
          - linux
          - windows
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD registry.gitlab.com
    - ./bsys6 build_image
    - docker push registry.gitlab.com/librewolf-community/browser/bsys6/$TARGET:latest

Linux:
  stage: build
  when: manual
  allow_failure: false
  image: registry.gitlab.com/librewolf-community/browser/bsys6/linux:latest
  tags:
    - autoscale
  except:
    - merge_requests
  script: ./bsys6 package
  artifacts:
    paths:
      - "*.tar.bz2"
      - "*.sha256sum"

Windows:
  stage: build
  when: manual
  allow_failure: false
  image: registry.gitlab.com/librewolf-community/browser/bsys6/windows:latest
  tags:
    - autoscale
  except:
    - merge_requests
  script:
    - TARGET=windows ./bsys6 package nsis msix win_portable
  artifacts:
    paths:
      - "*.zip"
      - "*setup.exe"
      - "*.msix"
      - "*.sha256sum"

Release:
  stage: release
  when: manual
  allow_failure: false
  image: registry.gitlab.com/librewolf-community/browser/bsys6/dind
  needs:
    - job: "Linux"
      artifacts: true
    - job: "Windows"
      artifacts: true
  only:
    - master
  except:
    - merge_requests
  script: ./bsys6 release
